name: Refresh Sunday football data
on:
  schedule:
    - cron: '17 8,11 * * 0'
      timezone: America/Chicago
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-schedule-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public football schedules, rosters and available stats
        run: node scripts/update-football.mjs football-feed.json schedule-feed.json
      - name: Save public data and visible source warnings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- football-feed.json schedule-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public Sunday football data"
            git push
          fi
